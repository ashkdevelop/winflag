version: "3.9"

services:
  api:
    build:
      context: ./backend/src/Winflag.API
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/data/winflag.db
      - Jwt__Key=winflag-super-secret-key-change-in-production-2024!
      - Jwt__Issuer=winflag-api
      - Jwt__Audience=winflag-app
      - Admin__Email=admin@winflag.in
      - Admin__Password=Admin@123
      - BaseUrl=http://localhost:5000
      - AllowedOrigin=http://localhost:5173
    volumes:
      - api_data:/data
      - api_uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api_data:
  api_uploads:
